name: WatchFlow CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collector and API tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate dependency audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            const totals = report.metadata?.vulnerabilities ?? {};
            const packages = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
            const summary = [
              '# Dependency audit',
              '',
              '| Critical | High | Moderate | Low | Total |',
              '|---:|---:|---:|---:|---:|',
              `|${totals.critical ?? 0}|${totals.high ?? 0}|${totals.moderate ?? 0}|${totals.low ?? 0}|${totals.total ?? 0}|`,
              '',
              '## Affected packages',
              '',
              ...packages.map(p => `- **${p.name}** — ${p.severity}; direct: ${p.direct}; range: ${p.range}; fixAvailable: ${JSON.stringify(p.fixAvailable)}`)
            ].join('\\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\\n');
            console.log(JSON.stringify({ totals, packages }, null, 2));
          "
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: watchflow-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
